# KEV multi-domain mock TOOL DESIGN ONLY — 200 tools, 20 domains.
# Not a deployed registry; no execution bindings or expanded frozen contracts implemented.
# Six registry fields retained. sample_utterances comments are design metadata, not scoring input.
# Existing navigation 14: exact six-field/schema preservation; extension is a separate domain.
tools:
  # navigation — 14 existing tools
  - {name: navi_to_special_poi, domain: navigation, description: "导航到用户已设置的家庭或公司地址", binding: mock, side_effect: non_idempotent, parameters: {type: object, properties: {poi_type: {type: string, enum: [home, company]}}, required: [poi_type], additionalProperties: false}} # sample_utterances: ["导航回家"]
  - {name: navi_open_address_page, domain: navigation, description: "打开家庭或公司地址设置页面", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {type: {type: string, enum: [home, company]}}, required: [type], additionalProperties: false}} # sample_utterances: ["打开公司地址设置页"]
  - {name: navi_search_in_address_page, domain: navigation, description: "在地址设置页面搜索地点", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {keyword: {type: string, minLength: 1}}, required: [keyword], additionalProperties: false}} # sample_utterances: ["在这个地址设置页搜索虹桥天地"]
  - {name: navi_search_along_poi, domain: navigation, description: "沿当前导航路线搜索指定类型或名称的地点", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {poi_name: {type: string, minLength: 1}, search_type: {type: integer}, query: {type: string}}, required: [poi_name], additionalProperties: false}} # sample_utterances: ["找一下当前路线沿途的咖啡店"]
  - {name: navi_search_nearby_poi, domain: navigation, description: "搜索当前位置或指定坐标附近的地点", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {poi_name: {type: string, minLength: 1}, query: {type: string}, center_address: {type: string}, longitude: {type: number}, latitude: {type: number}}, required: [poi_name], additionalProperties: false}} # sample_utterances: ["附近有什么便利店"]
  - {name: navi_search_keyword, domain: navigation, description: "按关键词搜索目的地或地点，可在地图展示", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {keyword: {type: string, minLength: 1}, query: {type: string}, show_in_map: {type: boolean}}, required: [keyword], additionalProperties: false}} # sample_utterances: ["在地图上搜索杭州西湖"]
  - {name: navi_start_route, domain: navigation, description: "启动导航到明确的目的地，可以指定途经点和路线偏好", binding: mock, side_effect: non_idempotent, parameters: {type: object, properties: {end_name: {type: string, minLength: 1}, end_address: {type: string}, end_lat: {type: number}, end_lng: {type: number}, via_points: {type: array, items: {type: object, properties: {name: {type: string}, address: {type: string}, lat: {type: number}, lng: {type: number}}, additionalProperties: false}}, query: {type: string}, route_option: {type: string, enum: [default, fastest, shortest, avoid_toll, avoid_highway]}, simulate: {type: boolean}}, required: [end_name], additionalProperties: false}} # sample_utterances: ["导航到已确认的虹桥机场T2"]
  - {name: navi_get_status, domain: navigation, description: "获取当前是否导航中及当前导航状态", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {}, additionalProperties: false}} # sample_utterances: ["现在是不是正在导航"]
  - {name: navi_get_route_info, domain: navigation, description: "获取当前路线详情", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {}, additionalProperties: false}} # sample_utterances: ["看看当前路线走哪些道路"]
  - {name: navi_add_waypoint, domain: navigation, description: "给已有导航路线添加明确坐标的途经点", binding: mock, side_effect: non_idempotent, parameters: {type: object, properties: {name: {type: string, minLength: 1}, address: {type: string}, lat: {type: number}, lng: {type: number}, position: {type: string, enum: [next, last]}}, required: [name, lat, lng], additionalProperties: false}} # sample_utterances: ["把已确认坐标的服务区加为下一途经点"]
  - {name: navi_switch_route, domain: navigation, description: "切换已规划路线或变更路线偏好", binding: mock, side_effect: conditional, parameters: {type: object, properties: {route_index: {type: integer}, preference: {type: string, enum: [fastest, shortest, avoid_toll, avoid_highway, less_traffic]}}, additionalProperties: false}} # sample_utterances: ["当前路线改成不走高速"]
  - {name: navi_get_remaining, domain: navigation, description: "获取导航剩余距离和时间", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {}, additionalProperties: false}} # sample_utterances: ["到目的地还要多久"]
  - {name: navi_cancel_route, domain: navigation, description: "取消正在进行的导航路线", binding: mock, side_effect: non_idempotent, parameters: {type: object, properties: {}, additionalProperties: false}} # sample_utterances: ["取消当前导航"]
  - {name: navi_show_poi_list, domain: navigation, description: "在车端展示已有地点搜索结果", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {keyword: {type: string}, poi_list: {type: array, items: {type: object, properties: {name: {type: string}, address: {type: string}, lat: {type: number}, lng: {type: number}, distance: {type: string}, rating: {type: string}}, required: [name, lat, lng], additionalProperties: false}}}, required: [poi_list], additionalProperties: false}} # sample_utterances: ["把刚才搜索到的地点列表显示出来"]
  # navigation_extension — 8 new tools
  - {name: navi_set_map_zoom, domain: navigation_extension, description: "设置导航地图缩放级别，不调屏幕亮度", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {level: {type: integer, minimum: 1, maximum: 20}}, required: [level], additionalProperties: false}} # sample_utterances: ["地图缩放设为15级"]
  - {name: navi_set_map_view, domain: navigation_extension, description: "切换导航地图为二维、三维或卫星视图", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {view: {type: string, enum: [two_d, three_d, satellite]}}, required: [view], additionalProperties: false}} # sample_utterances: ["地图切到三维视图"]
  - {name: navi_set_voice_guidance, domain: navigation_extension, description: "设置导航播报为完整、简洁或静音，不调整全车音量", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {mode: {type: string, enum: [full, brief, muted]}}, required: [mode], additionalProperties: false}} # sample_utterances: ["导航播报静音"]
  - {name: navi_get_traffic, domain: navigation_extension, description: "查询指定道路或当前路线的交通拥堵，不查询天气", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {scope: {type: string, enum: [current_route, road]}, road: {type: string, minLength: 1}}, required: [scope], allOf: [{if: {properties: {scope: {const: road}}}, then: {required: [road]}}], additionalProperties: false}} # sample_utterances: ["当前路线堵不堵"]
  - {name: navi_save_favorite, domain: navigation_extension, description: "收藏已确认的地图地点，不收藏歌曲或商家订单", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {poi_id: {type: string, minLength: 1}, label: {type: string, minLength: 1}}, required: [poi_id, label], additionalProperties: false}} # sample_utterances: ["把已选的这家咖啡店收藏为常去地点"]
  - {name: navi_list_favorites, domain: navigation_extension, description: "列出收藏的导航地点，不启动导航", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {}, additionalProperties: false}} # sample_utterances: ["显示我收藏的地图地点"]
  - {name: navi_delete_favorite, domain: navigation_extension, description: "删除明确指定的导航地点收藏，不删除家庭地址", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {poi_id: {type: string, minLength: 1}}, required: [poi_id], additionalProperties: false}} # sample_utterances: ["删除刚选中地点的地图收藏"]
  - {name: navi_share_destination, domain: navigation_extension, description: "分享已确认目的地的位置卡片给指定联系人，不发送自由文本消息", binding: mock, side_effect: non_idempotent, parameters: {type: object, properties: {poi_id: {type: string, minLength: 1}, recipient_id: {type: string, minLength: 1}}, required: [poi_id, recipient_id], additionalProperties: false}} # sample_utterances: ["把已选目的地的位置卡片分享给已确认的小王"]
  # climate — 12
  - {name: climate_set_power, domain: climate, description: "开启或关闭座舱空调系统，不控制座椅通风", binding: mock, side_effect: idempotent, parameters: {type: object, properties: {enabled: {type: boolean}}, required: [enabled], additionalProperties: false}} # sample_utterances: ["打开空调"]
